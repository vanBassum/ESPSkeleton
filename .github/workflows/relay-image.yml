name: Relay image

on:
  push:
    branches:
      - main
    paths:
      - "relay-server/**"
      - ".github/workflows/relay-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/strux-relay

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # :latest is what the compose file tracks; :sha-<short> is what you pin to
      # when you need to know exactly what is running.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      # amd64 only — the server is x86_64, and adding arm64 means QEMU emulation
      # for a build whose only real work is `pip install`.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: relay-server
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
